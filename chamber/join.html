  <main>
    <h1>Join - Gilbert, Arizona Chamber of Commerce</h1>
    <div class="tag">
      <form action="thankyou.html" method="get" class="join-form tag">
        <!-- FIRST NAME -->
        <label>First Name <input type="text" name="first" required autocomplete="given-name"
            title="Your First Name"></label>
        <!-- LAST NAME -->
        <label>Last Name <input type="text" name="last" required autocomplete="family-name"
            title="Your Last Name"></label>
        <!-- TITLE -->
        <label>Organization Title <input type="text" name="title" required autocomplete="organization-title"
            title="Nome of your Organization"></label>
        <!-- pattern to only accept alpha characters, hyphens, and spaces with a minimum of seven (7) characters using a regular expression -->
        <!-- EMAIL -->
        <label>Email <input type="email" name="email" required autocomplete="email" title="name@organization.com"
            placeholder="name@organization.com"></label>
        <!-- MOBILE -->
        <label>Mobile Phone Number <input type="tel" name="phone" required autocomplete="tel"
            title="Mobile Phone Number" placeholder="1234567890"></label>
        <!-- ORGANIZATION NAME -->
        <label>Business/Organization's Name <input type="text" name="org" required autocomplete="organization"
            title="Organization Name"></label>
        <!-- MEMBERSHIP LEVEL -->
        <!-- drop menu -->
        <label>Membership Level
          <select name="level" required>
            <option value="">-- Select Level --</option>
            <option value="gold">Gold - $300</option>
            <option value="silver">Silver - $200</option>
            <option value="bronze">Bronze - $100</option>
            <option value="np">NP (Non-Profit) - $0</option>
          </select>
        </label>

        <!-- DESCRIPTION OF ORGANIZATION -->
        <label><textarea type="text" title="Tell us about your organization." name="description"
            placeholder="Tell us about your organization."></textarea></label>
        <!-- HIDDEN TIMESTAMP -->
        <label><input type="hidden" name="timestamp" value="12:00" id="timestamp"></label>
        <!-- SUBMIT BUTTON -->
        <input type="submit" value="Join Us!">

      </form>
    </div>
  </main>
