<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jakes LegenDairy Cheese, amazing handcrafted cheeses</title>
    <meta name="description"
        content="Welcome to Jakes LegenDairy Cheese. Join our newsletter. Write a review. Ask a question. Next market info.">
    <meta name="author" content="Jacob Dwayne Ethington">
    <!-- SOCIALMEDIA -->
    <meta property="og:title" content="Jakes LegenDairy Cheese, amazing handcrafted cheeses">
    <meta property="og:description"
        content="Welcome to Jakes LegenDairy Cheese. Join our newsletter. Write a review. Ask a question. Next market info.">
    <meta property="og:image" content="https://jdethington.github.io/wdd231/finalproject/images/favicon.ico">
    <meta property="og:url" content="https://jdethington.github.io/wdd231/finalproject/join.html">
    <!-- FAVICON -->
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
    <!-- STYLESHEETS -->
    <link rel="stylesheet" href="../styles/normalize.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/medium.css">
    <link rel="stylesheet" href="styles/large.css">
    <!-- SCRIPTS -->
    <script type="module" src="scripts/nav-dates.js"></script>
    <script type="module" src="scripts/form-display.js"></script>
    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:wght@100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <div>
            <img src="images/logo-square.webp" alt="Logo for Jakes Cheese" width="1" height="1">
            <span> Jakes LegenDairy Cheese </span>
            <button id="nav-button" class="hamburger" aria-label="navigation"></button>
        </div>
    </header>
    <nav id="nav-bar" class="navigation">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Our Cheese</a></li>
            <li class="current"><a href="join.html">Find Us</a></li>
        </ul>
    </nav>

    <main>
        <h1>Find out more</h1>
        <div class="cheeseButton">
            <button id="btn-email" class="cheeseSelected">Newsletter signup</button>
            <button id="btn-review">Write a review</button>
            <button id="btn-question">Ask a question</button>
        </div>
        <div class="forms" id="form">

            <!-- request newsletter -->
            <div class="email ">
                <form action="thank-you.html" method="get" class="join-email">
                    <fieldset>
                        <legend>Get News Letter</legend>
                        <label>First Name <input type="text" name="fname" autocomplete="given-name"
                                title="Your First Name" placeholder="Jakes"></label>
                        <label>Last Name <input type="text" name="lname" autocomplete="family-name"
                                title="Your Last Name" placeholder="LegenDairy"></label>

                        <label>Email <input type="email" name="email" required autocomplete="email"
                                placeholder="jake@jakescheese.com"></label>
                        <input type="submit" value="Send me info!">
                    </fieldset>
                    <!-- HIDDEN TIMESTAMP, newsletter -->
                    <label><input type="hidden" name="timestamp" value="12:00" id="subscribe-timestamp"></label>
                    <label><input type="hidden" name="isNewsletter" value="true"></label>
                </form>
            </div>

            <!-- Post a review -->
            <div class="review no-show">
                <form action="thank-you.html" method="get" class="submit-review">
                    <fieldset>
                        <legend>Submit a review</legend>
                        <label>First Name <input type="text" name="fname" autocomplete="given-name"
                                title="Your First Name" placeholder="Jakes"></label>
                        <label>Last Name <input type="text" name="lname" autocomplete="family-name"
                                title="Your Last Name" placeholder="LegenDairy"></label>
                        <label>City<input type="text" name="city" autocomplete="address-level2"
                                title="Where you are from" placeholder="Gilbert"></label>
                        <label><textarea title="What do you think?" name="review"
                                placeholder="This is the greatest cheese!🧀😁" required></textarea></label>
                        <input type="submit" value="Post my review!">
                    </fieldset>
                    <!-- HIDDEN TIMESTAMP -->
                    <label><input type="hidden" name="timestamp" value="12:00" id="review-timestamp"></label>
                    <!-- <label><input type="hidden" name="review" value="true" id="isReview"></label> -->
                </form>
            </div>

            <!-- Ask a question -->
            <div class="question no-show">
                <form action="thank-you.html" method="get" class="submit-question">
                    <fieldset>
                        <legend>Ask a question</legend>
                        <label>First Name <input type="text" name="fname" autocomplete="given-name"
                                title="Your First Name" placeholder="Jakes"></label>
                        <label>Last Name <input type="text" name="lname" autocomplete="family-name"
                                title="Your Last Name" placeholder="LegenDairy"></label>
                        <label>Email <input type="email" name="email" required autocomplete="email"
                                placeholder="jake@jakescheese.com"></label>
                        <label><textarea title="How can we help you?" name="question"
                                placeholder="Where can I get the greatest cheese!🧀😁" required></textarea></label>
                        <input type="submit" value="Get an answer">
                    </fieldset>
                    <!-- HIDDEN TIMESTAMP -->
                    <label><input type="hidden" name="timestamp" value="12:00" id="question-timestamp"></label>
                    <!-- <label><input type="hidden" name="question" value="true" id="isQuestion"></label> -->
                </form>
            </div>

            <div class="market">
                <img src="images/manny-oct28.webp" alt="next sale">
            </div>
        </div>
    </main>

    <footer>
        <div>
            <!-- youtube video of final project -->
            <div class="video"><a href="https://youtu.be/Ct4-rt-4Ogo" target="_blank">Final Project Video</a></div>
            <div class="social">
                <a href="https://www.facebook.com/jacob.ethington.50" target="_blank"><img
                        src="images/socialmedia/facebook.svg" loading="lazy" alt="facebook"></a>
                <a href="https://x.com/home" target="_blank"><img src="images/socialmedia/twitter-x.svg" loading="lazy"
                        alt="twitter-X"></a>
                <a href="https://www.youtube.com/" target="_blank"><img src="images/socialmedia/youtube.svg"
                        loading="lazy" alt="youtube"></a>
            </div>
            <div class="date">
                <p><span id="currentYear"></span> 🐄 Jacob Dwayne Ethington 🐄 Arizona, USA</p>
                <p><span id="lastModified"></span></p>
            </div>
        </div>
    </footer>

</body>

</html>
